# README-compliant, non-Sail compose file. Brings up the API + MySQL with a
# plain `docker compose up`. Sail's own compose.yaml (dev/test tool, ports
# 80/3306) is untouched; this file uses different host ports (8080/3307) so
# both can coexist without conflicting.
#
# Usage:
#   cp .env.example .env.docker   # then set DB_* below to match the `mysql`
#                                  # service and APP_KEY (php artisan key:generate --show)
#   docker compose -f docker-compose.yml up -d --build
#   docker compose -f docker-compose.yml exec app php artisan migrate --force
#   curl http://localhost:8080/up
#
# IMPORTANT: an explicit `name:` is set below so this stack's containers,
# network, and volumes never collide with Sail's (compose.yaml) containers,
# even though both files live in the same directory and would otherwise
# derive the same default Compose project name from the directory name.
name: fone-ninja-backend-prod

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: fone-ninja-backend:latest
        restart: unless-stopped
        ports:
            - '8080:80'
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_KEY: '${APP_KEY}'
            APP_URL: 'http://localhost:8080'
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: '${DB_DATABASE:-fone_ninja}'
            DB_USERNAME: '${DB_USERNAME:-fone_ninja}'
            DB_PASSWORD: '${DB_PASSWORD:-secret}'
            LOG_CHANNEL: stderr
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - fone-ninja

    mysql:
        image: 'mysql:8.4'
        restart: unless-stopped
        ports:
            - '3307:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
            MYSQL_DATABASE: '${DB_DATABASE:-fone_ninja}'
            MYSQL_USER: '${DB_USERNAME:-fone_ninja}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - fone-ninja-mysql:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            retries: 10
            timeout: 5s
        networks:
            - fone-ninja

networks:
    fone-ninja:
        driver: bridge

volumes:
    fone-ninja-mysql:
        driver: local
