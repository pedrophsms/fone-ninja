# Fone Ninja full stack — frontend SPA + backend API + MySQL.
#
# Single consolidated repo, matching the challenge's /projeto layout:
#
#   fone-ninja/
#   ├── docker-compose.yml
#   ├── frontend/   <- Vue SPA, own Dockerfile + nginx /api proxy
#   └── backend/    <- Laravel API, own Dockerfile
#
# Usage:
#   cp .env.docker.example .env.docker
#   # set APP_KEY (run: php artisan key:generate --show)
#   docker compose --env-file .env.docker up -d --build
#   docker compose --env-file .env.docker exec backend php artisan migrate --seed --force
#   open http://localhost:8080   (login: demo@fone-ninja.test / password123)
name: fone-ninja-stack

services:
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        restart: unless-stopped
        ports:
            - '${FRONTEND_PORT:-8080}:80'
        depends_on:
            - backend
        networks:
            - fone-ninja

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        image: fone-ninja-backend:latest
        restart: unless-stopped
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_KEY: '${APP_KEY:?APP_KEY is required - see .env.docker.example}'
            APP_URL: 'http://localhost:${FRONTEND_PORT:-8080}'
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: '${DB_DATABASE:-fone_ninja}'
            DB_USERNAME: '${DB_USERNAME:-fone_ninja}'
            DB_PASSWORD: '${DB_PASSWORD:-secret}'
            LOG_CHANNEL: stderr
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - fone-ninja

    mysql:
        image: 'mysql:8.4'
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
            MYSQL_DATABASE: '${DB_DATABASE:-fone_ninja}'
            MYSQL_USER: '${DB_USERNAME:-fone_ninja}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - fone-ninja-mysql:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            retries: 10
            timeout: 5s
        networks:
            - fone-ninja

networks:
    fone-ninja:
        driver: bridge

volumes:
    fone-ninja-mysql:
        driver: local
